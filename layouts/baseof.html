<!doctype html>
<html lang="{{ site.Language.Locale | default "en" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
  <meta name="description" content="{{ site.Params.description }}">
  <link rel="canonical" href="{{ .Permalink }}">
  <meta name="color-scheme" content="light dark">

  <script>
    // Applied before first paint so a remembered theme never flashes.
    try {
      var t = localStorage.getItem('theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ site.Title }}">
  <meta property="og:title" content="{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }}{{ end }}">
  <meta property="og:description" content="{{ site.Params.description }}">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta name="twitter:card" content="summary">

  <link rel="icon" href="data:image/svg+xml,{{ `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><text y="26" font-size="26">🔗</text></svg>` | urlquery }}">

  {{ with resources.Get "css/main.css" }}
    {{ $css := . | minify | fingerprint }}
    <link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}">
  {{ end }}
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  {{ block "main" . }}{{ end }}
  {{ partial "footer.html" . }}

  {{ with resources.Get "js/app.js" }}
    {{ $js := . | js.Build (dict "minify" true) | fingerprint }}
    <script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>
  {{ end }}
</body>
</html>
